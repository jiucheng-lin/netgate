<title>NetGate - 应用联网管理</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-soft: #eff6ff;
    --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
         background: var(--bg); color: var(--ink); font-size: 14px; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 24px;
           display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  .badge { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft);
           color: var(--accent); }
  .badge.warn { background: #fef3c7; color: var(--warn); }
  .wrap { max-width: 1000px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px 20px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 14px; font-size: 15px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text] { flex: 1; min-width: 260px; padding: 9px 11px; border: 1px solid var(--line);
          border-radius: 6px; font-size: 13px; font-family: inherit; }
  button { padding: 9px 15px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
           cursor: pointer; font-size: 13px; font-family: inherit; color: var(--ink); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: #1d4ed8; color: #fff; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.6; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line);
           font-size: 13px; word-break: break-all; }
  th { color: var(--muted); font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .pill.on { background: #dcfce7; color: var(--ok); }
  .pill.off { background: #f3f4f6; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 26px; }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--danger); }
  .scanlist { margin-top: 10px; max-height: 220px; overflow: auto; border: 1px solid var(--line);
              border-radius: 6px; padding: 6px; display: none; }
  .scanlist label { display: block; padding: 5px 7px; border-radius: 4px; font-size: 12px; }
  .scanlist label:hover { background: var(--bg); }
  .stats { display: flex; gap: 28px; }
  .stat b { display: block; font-size: 24px; color: var(--accent); }
  .stat span { color: var(--muted); font-size: 12px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
</style>

<footer data-page-node-id="vZOqPJ0mxBVwBPnWCT7V9H">NetGate · 本地运行，仅监听 127.0.0.1 · 通用工具，不含任何软件名单</footer>

<script>
function $(id) { return document.getElementById(id); }
function setMsg(id, text, ok) {
  var el = $(id); el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err');
}
function api(url, method, body) {
  var opt = { method: method || 'GET' };
  if (body !== undefined) {
    opt.headers = { 'Content-Type': 'application/json; charset=utf-8' };
    opt.body = JSON.stringify(body);
  }
  return fetch(url, opt).then(function(r){ return r.json(); });
}

function refreshStatus() {
  api('/api/status', 'GET').then(function(d){
    $('sBlocked').textContent = d.BlockedCount;
    $('sRules').textContent = d.RuleCount;
    $('sVersion').textContent = d.Version;
    var b = $('adminBadge');
    if (d.IsAdmin) { b.textContent = '管理员权限 · 就绪'; b.className = 'badge'; }
    else { b.textContent = '非管理员 · 写入将失败'; b.className = 'badge warn'; }
  });
}

function refreshList() {
  api('/api/list', 'GET').then(function(list){
    var body = $('ruleBody'); body.innerHTML = '';
    $('emptyHint').style.display = list.length ? 'none' : 'block';
    list.forEach(function(item){
      var tr = document.createElement('tr');
      var state = item.Enabled
        ? '<span class="pill on">生效中</span>'
        : '<span class="pill off">已暂停</span>';
      var toggle = item.Enabled ? '暂停' : '恢复';
      tr.innerHTML =
        '<td>' + escapeHtml(item.Path) + '</td>' +
        '<td>' + (item.Outbound ? '是' : '-') + '</td>' +
        '<td>' + (item.Inbound ? '是' : '-') + '</td>' +
        '<td>' + state + '</td>' +
        '<td>' +
          '<button data-act="toggle" data-hash="' + item.Hash + '" data-path="' + escapeAttr(item.Path) + '">' + toggle + '</button> ' +
          '<button class="danger" data-act="del" data-path="' + escapeAttr(item.Path) + '">解除</button>' +
        '</td>';
      body.appendChild(tr);
    });
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escapeAttr(s) { return escapeHtml(s); }

$('btnBlock').onclick = function(){
  var p = $('exePath').value.trim();
  if (!p) { setMsg('addMsg', '请输入程序路径', false); return; }
  setMsg('addMsg', '处理中...', true);
  api('/api/block', 'POST', { path: p }).then(function(d){
    if (d.ok) { setMsg('addMsg', '已禁止：' + d.path, true); $('exePath').value=''; refreshAll(); }
    else setMsg('addMsg', '失败：' + (d.error || (d.errors||[]).join('; ')), false);
  }).catch(function(e){ setMsg('addMsg', '请求失败：'+e, false); });
};

$('btnScan').onclick = function(){
  var d = $('scanDir').value.trim();
  if (!d) { setMsg('scanMsg', '请输入目录路径', false); return; }
  setMsg('scanMsg', '扫描中...', true);
  api('/api/scan', 'POST', { directory: d, recurse: $('scanRecurse').checked }).then(function(r){
    if (!r.ok) { setMsg('scanMsg', '失败：' + r.error, false); return; }
    var box = $('scanList'); box.innerHTML = '';
    r.paths.forEach(function(p){
      var label = document.createElement('label');
      label.innerHTML = '<input type="checkbox" value="' + escapeAttr(p) + '"> ' + escapeHtml(p);
      box.appendChild(label);
    });
    box.style.display = r.paths.length ? 'block' : 'none';
    $('scanActions').style.display = r.paths.length ? 'flex' : 'none';
    setMsg('scanMsg', '找到 ' + r.count + ' 个程序', true);
  }).catch(function(e){ setMsg('scanMsg', '请求失败：'+e, false); });
};

$('btnBlockSelected').onclick = function(){
  var checks = $('scanList').querySelectorAll('input:checked');
  if (!checks.length) { setMsg('scanMsg', '请先勾选程序', false); return; }
  var paths = [];
  checks.forEach(function(c){ paths.push(c.value); });
  var done = 0, fail = 0;
  setMsg('scanMsg', '处理 0/' + paths.length, true);
  paths.forEach(function(p){
    api('/api/block', 'POST', { path: p }).then(function(d){
      if (d.ok) done++; else fail++;
      setMsg('scanMsg', '处理 ' + (done+fail) + '/' + paths.length, true);
      if (done+fail === paths.length) {
        setMsg('scanMsg', '完成：成功 ' + done + '，失败 ' + fail, fail===0);
        refreshAll();
      }
    });
  });
};

$('ruleBody').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  var act = b.getAttribute('data-act'), p = b.getAttribute('data-path');
  if (act === 'del') {
    if (!confirm('确认解除对这个程序的联网管理？')) return;
    api('/api/unblock', 'POST', { path: p }).then(function(){ refreshAll(); });
  } else if (act === 'toggle') {
    var isOn = b.textContent === '暂停';
    api(isOn ? '/api/disable' : '/api/enable', 'POST', { path: p }).then(function(){ refreshAll(); });
  }
});

$('btnExport').onclick = function(){
  api('/api/export', 'POST', {}).then(function(d){
    var blob = new Blob([JSON.stringify(d, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'netgate-rules.json';
    a.click(); URL.revokeObjectURL(a.href);
    setMsg('ioMsg', '配置已导出', true);
  });
};

$('btnImport').onclick = function(){ $('importFile').click(); };
$('importFile').onchange = function(){
  var f = this.files[0]; if (!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    setMsg('ioMsg', '导入中...', true);
    api('/api/import', 'POST', JSON.parse(reader.result)).then(function(d){
      if (d.ok) setMsg('ioMsg', '导入完成：新增 '+d.added+'，跳过 '+d.skipped, true);
      else setMsg('ioMsg', '失败：'+d.error, false);
      refreshAll();
    }).catch(function(e){ setMsg('ioMsg', '请求失败：'+e, false); });
  };
  reader.readAsText(f);
};

$('btnReset').onclick = function(){
  if (!confirm('确认清除 NetGate 创建的全部规则？此操作不影响其他软件的防火墙设置。')) return;
  api('/api/reset', 'POST', {}).then(function(d){
    setMsg('ioMsg', '已清除 ' + d.removed + ' 条规则', true); refreshAll();
  });
};

function refreshAll() { refreshStatus(); refreshList(); }
refreshAll();
</script>
